name: Update vintage chart

on:
  schedule:
    - cron: "17 3 * * 1" # Mondays 03:17 UTC
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-chart
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      # One critic's site refusing us should not hold back the other two.
      - name: Collect the three charts
        id: collect
        continue-on-error: true
        run: npm run collect
      - name: Rebuild the chart
        run: npm run build
      - name: Commit if anything changed
        id: commit
        run: |
          git add data web/data
          if git diff --cached --quiet; then
            echo "No score changes."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "Update vintage chart data"
            git push
          fi
      - name: Fail if a collector failed
        if: steps.collect.outcome == 'failure'
        run: |
          echo "At least one critic's chart could not be collected; see the Collect step."
          exit 1

  # A push made by a workflow does not start other workflows, so deploy from here.
  deploy:
    needs: update
    if: always() && needs.update.outputs.changed == 'true'
    uses: ./.github/workflows/deploy.yml
